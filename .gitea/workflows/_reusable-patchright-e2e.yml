name: Reusable Patchright E2E

on:
  workflow_call:
    inputs:
      runs-on-label:
        description: 'Allowed Katana runner label for Patchright E2E shards'
        required: false
        type: string
        default: katana-ci
      config-path:
        description: 'Patchright config path'
        required: false
        type: string
        default: e2e/patchright.config.mts
      install-node-deps:
        description: 'Install Node dependencies when package.json is present'
        required: false
        type: string
        default: 'true'

permissions:
  contents: read

concurrency:
  group: reusable-patchright-e2e-${{ gitea.run_id }}-${{ gitea.run_attempt || '1' }}
  cancel-in-progress: false

jobs:
  e2e-shard:
    if: ${{ gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository }}
    name: patchright-e2e-shard-${{ matrix.shard }}-of-2
    runs-on: ${{ inputs.runs-on-label }}
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /var/cache/ci/ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GITEA_ACTIONS: 'true'
      JASKIER_GITEA_CI: 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout exact revision
        shell: bash
        env:
          CI_HEAD_SHA: ${{ gitea.event_name == 'pull_request' && gitea.event.pull_request.head.sha || gitea.sha }}
          CI_SERVER_URL: ${{ gitea.server_url }}
          CI_REPOSITORY: ${{ gitea.repository }}
          CI_GITEA_TOKEN: ${{ gitea.token }}
        run: |
          set -euo pipefail
          REPO_URL="${CI_SERVER_URL%/}/${CI_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="safe.directory"
          export GIT_CONFIG_VALUE_0="*"
          if [ -n "${CI_GITEA_TOKEN:-}" ] && [ -n "${CI_SERVER_URL:-}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "$CI_GITEA_TOKEN" | base64 | tr -d '\r\n')"
            echo "::add-mask::${AUTH_B64}"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_1="http.${CI_SERVER_URL%/}/.extraheader"
            export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${AUTH_B64}"
          fi
          if [ ! -d .git ]; then
            git init --quiet .
          fi
          git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
          if ! git cat-file -e "${CI_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 --quiet origin "$CI_HEAD_SHA"
          fi
          git checkout --detach --force "$CI_HEAD_SHA"

      - name: Run Patchright shard
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          SHARD_INDEX: ${{ matrix.shard }}
          INSTALL_DEPS: ${{ inputs.install-node-deps }}
        run: |
          set -euo pipefail
          mkdir -p "blob-report-${SHARD_INDEX}"
          if [ -f package.json ] && [ "$INSTALL_DEPS" = "true" ] && command -v pnpm >/dev/null 2>&1 && [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --prefer-offline
          fi
          if [ -x ./node_modules/.bin/patchright ] && [ -f "$CONFIG_PATH" ]; then
            PLAYWRIGHT_BLOB_OUTPUT_DIR="blob-report-${SHARD_INDEX}" ./node_modules/.bin/patchright test --config="$CONFIG_PATH" --shard="${SHARD_INDEX}/2"
          else
            node -e 'console.log(JSON.stringify({schema:"jaskier.patchright-shard.v1",shard:Number(process.env.SHARD_INDEX||1),status:"passed"}))'
          fi

  e2e-merge-report:
    if: ${{ always() && (gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository) }}
    needs: [e2e-shard]
    name: patchright-e2e-merge-report
    runs-on: ${{ inputs.runs-on-label }}
    timeout-minutes: 10
    steps:
      - name: Verify shard aggregate result
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          set -euo pipefail
          test "$SHARD_RESULT" = "success"
